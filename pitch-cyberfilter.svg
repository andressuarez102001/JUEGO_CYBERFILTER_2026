<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Pitch CyberFilter: La frontera lógica</title>
  <desc id="description">Lámina de pitch de cinco a siete minutos para el juego educativo CyberFilter.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#071333"/>
      <stop offset="1" stop-color="#170725"/>
    </linearGradient>
    <linearGradient id="cyanPanel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a2648" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#071123" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="magentaPanel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2b1248" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0b1026" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#05b8df"/>
      <stop offset="1" stop-color="#c422c7"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#49efff" stroke-opacity=".08"/>
      <circle cx="0" cy="0" r="1.5" fill="#49efff" fill-opacity=".18"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="portraitClip"><rect x="0" y="0" width="142" height="158" rx="12"/></clipPath>
    <style>
      .orbitron { font-family: Orbitron, Arial, sans-serif; }
      .title { font-family: Orbitron, Arial, sans-serif; font-weight: 800; letter-spacing: 2px; }
      .copy { font-family: Arial, sans-serif; fill: #d9f7ff; }
      .label { font-family: Orbitron, Arial, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 2.2px; }
      .section { font-family: Orbitron, Arial, sans-serif; fill: #fff; font-size: 20px; font-weight: 700; }
      .small { font-family: Arial, sans-serif; fill: #c8e4f0; font-size: 16px; }
      .card { stroke-width: 1.5px; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <path d="M-60 238H180l72-72h260l90 90h230" fill="none" stroke="#1ce2ff" stroke-opacity=".24" stroke-width="5"/>
  <path d="M1120 894h164l88-88h190l82-82h336" fill="none" stroke="#ff38d4" stroke-opacity=".2" stroke-width="5"/>
  <circle cx="252" cy="166" r="10" fill="#1ce2ff" filter="url(#glow)"/>
  <circle cx="1372" cy="806" r="10" fill="#ff38d4" filter="url(#glow)"/>
  <rect x="34" y="30" width="1852" height="1020" rx="26" fill="none" stroke="#24e6ff" stroke-opacity=".65" stroke-width="2"/>
  <path d="M64 78h175M64 78v86M1856 78h-175M1856 78v86M64 1002h175M64 1002v-86M1856 1002h-175M1856 1002v-86" fill="none" stroke="#ff2cd5" stroke-width="4" filter="url(#softGlow)"/>

  <!-- Header -->
  <text x="96" y="94" class="label" fill="#28e8ff">PITCH DE PROYECTO · 5–7 MINUTOS</text>
  <text x="96" y="166" class="title" font-size="58" fill="#e9fdff" filter="url(#softGlow)">CYBERFILTER</text>
  <text x="99" y="204" class="title" font-size="24" fill="#ff42d7">LA FRONTERA LÓGICA</text>
  <text x="683" y="103" class="title" font-size="23" fill="#89f7ff">“APRENDER TEORÍA DE CONJUNTOS PUEDE SER UNA MISIÓN.”</text>
  <text x="685" y="138" class="copy" font-size="19">Juego de cartas educativo con estética cyberpunk, decisiones tácticas y retroalimentación inmediata.</text>
  <rect x="1550" y="76" width="238" height="72" rx="16" fill="url(#cta)" filter="url(#softGlow)"/>
  <text x="1669" y="106" class="title" font-size="14" fill="#fff" text-anchor="middle">PRESENTA:</text>
  <text x="1669" y="133" class="title" font-size="18" fill="#fff" text-anchor="middle">TU NOMBRE</text>

  <!-- Left: storytelling route -->
  <g transform="translate(96 268)">
    <text x="0" y="0" class="label" fill="#ff52dc">RUTA DEL PITCH</text>
    <line x1="18" y1="38" x2="18" y2="635" stroke="#2ae7ff" stroke-opacity=".36" stroke-width="2"/>

    <g transform="translate(0 58)">
      <circle cx="18" cy="0" r="18" fill="#0a233e" stroke="#2ae7ff" stroke-width="2"/><text x="18" y="6" class="title" font-size="15" fill="#fff" text-anchor="middle">1</text>
      <text x="54" y="-5" class="section">GANCHO</text><text x="54" y="21" class="small">¿Por qué aprender matemáticas se siente distante?</text><text x="472" y="-5" class="label" fill="#2ae7ff">0:00–0:35</text>
    </g>
    <g transform="translate(0 164)">
      <circle cx="18" cy="0" r="18" fill="#0a233e" stroke="#2ae7ff" stroke-width="2"/><text x="18" y="6" class="title" font-size="15" fill="#fff" text-anchor="middle">2</text>
      <text x="54" y="-5" class="section">PROBLEMA</text><text x="54" y="21" class="small">Teoría abstracta + baja participación en clase.</text><text x="472" y="-5" class="label" fill="#2ae7ff">0:35–1:20</text>
    </g>
    <g transform="translate(0 270)">
      <circle cx="18" cy="0" r="18" fill="#0a233e" stroke="#2ae7ff" stroke-width="2"/><text x="18" y="6" class="title" font-size="15" fill="#fff" text-anchor="middle">3</text>
      <text x="54" y="-5" class="section">SOLUCIÓN</text><text x="54" y="21" class="small">Un juego que transforma filtros lógicos en decisiones.</text><text x="472" y="-5" class="label" fill="#2ae7ff">1:20–2:15</text>
    </g>
    <g transform="translate(0 376)">
      <circle cx="18" cy="0" r="18" fill="#0a233e" stroke="#2ae7ff" stroke-width="2"/><text x="18" y="6" class="title" font-size="15" fill="#fff" text-anchor="middle">4</text>
      <text x="54" y="-5" class="section">EXPERIENCIA</text><text x="54" y="21" class="small">Cinco niveles, cartas, tiempo y preguntas de recuperación.</text><text x="472" y="-5" class="label" fill="#2ae7ff">2:15–3:25</text>
    </g>
    <g transform="translate(0 482)">
      <circle cx="18" cy="0" r="18" fill="#0a233e" stroke="#2ae7ff" stroke-width="2"/><text x="18" y="6" class="title" font-size="15" fill="#fff" text-anchor="middle">5</text>
      <text x="54" y="-5" class="section">IMPACTO + CIERRE</text><text x="54" y="21" class="small">Aprender jugando, fallar sin rendirse y volver a intentar.</text><text x="472" y="-5" class="label" fill="#2ae7ff">3:25–6:00</text>
    </g>
  </g>

  <!-- Center: game proof -->
  <g transform="translate(710 255)">
    <rect width="660" height="531" rx="22" fill="url(#cyanPanel)" stroke="#2ae7ff" class="card"/>
    <text x="32" y="48" class="label" fill="#2ae7ff">¿QUÉ ES CYBERFILTER?</text>
    <text x="32" y="91" class="title" font-size="28" fill="#fff">APRENDIZAJE ACTIVO EN FORMA DE MISIÓN</text>
    <text x="32" y="124" class="small">Cada agente representa un conjunto; sus roles, atributos y cruces</text>
    <text x="32" y="146" class="small">convierten la teoría de conjuntos en un reto visual y memorable.</text>
    <path d="M34 176H626" stroke="#2ae7ff" stroke-opacity=".28"/>

    <g transform="translate(32 207)">
      <rect width="178" height="135" rx="12" fill="#07162e" stroke="#ff43d7"/>
      <text x="18" y="29" class="label" fill="#ff55da">01 · IDENTIFICA</text>
      <text x="18" y="62" class="copy" font-size="17">Observa conjuntos,</text><text x="18" y="84" class="copy" font-size="17">roles y pistas.</text>
    </g>
    <g transform="translate(241 207)">
      <rect width="178" height="135" rx="12" fill="#07162e" stroke="#2ae7ff"/>
      <text x="18" y="29" class="label" fill="#2ae7ff">02 · DECIDE</text>
      <text x="18" y="62" class="copy" font-size="17">Selecciona las</text><text x="18" y="84" class="copy" font-size="17">cartas correctas.</text>
    </g>
    <g transform="translate(450 207)">
      <rect width="178" height="135" rx="12" fill="#07162e" stroke="#29ffb4"/>
      <text x="18" y="29" class="label" fill="#29ffb4">03 · APRENDE</text>
      <text x="18" y="62" class="copy" font-size="17">Recibe feedback y</text><text x="18" y="84" class="copy" font-size="17">repite el desafío.</text>
    </g>

    <g transform="translate(32 380)">
      <text x="0" y="0" class="label" fill="#ff55da">DIFERENCIADORES</text>
      <text x="0" y="34" class="copy" font-size="18">✦ 5 niveles progresivos</text>
      <text x="0" y="66" class="copy" font-size="18">✦ Reloj de 30 segundos por reto</text>
      <text x="0" y="98" class="copy" font-size="18">✦ Preguntas de trivia para recuperarse</text>
      <text x="335" y="34" class="copy" font-size="18">✦ Estética cyberpunk inmersiva</text>
      <text x="335" y="66" class="copy" font-size="18">✦ Jugabilidad individual y responsive</text>
      <text x="335" y="98" class="copy" font-size="18">✦ Error = oportunidad de aprender</text>
    </g>
  </g>

  <!-- Right: cast -->
  <g transform="translate(1407 255)">
    <text x="0" y="0" class="label" fill="#ff55da">UNIVERSO DE AGENTES</text>
    <text x="0" y="34" class="section">CUATRO CONJUNTOS. UNA MISIÓN.</text>
    <g transform="translate(0 58)">
      <g clip-path="url(#portraitClip)"><image x="0" y="0" width="142" height="158" preserveAspectRatio="xMidYMid slice" xlink:href="img/Cyborg-jefe.png"/></g><rect width="142" height="158" rx="12" fill="none" stroke="#ff416e" stroke-width="2"/><text x="71" y="185" class="label" fill="#ff6388" text-anchor="middle">CYBORG</text>
      <g transform="translate(170)"><g clip-path="url(#portraitClip)"><image width="142" height="158" preserveAspectRatio="xMidYMid slice" xlink:href="img/HACKER-jefe.png"/></g><rect width="142" height="158" rx="12" fill="none" stroke="#24ffc0" stroke-width="2"/><text x="71" y="185" class="label" fill="#24ffc0" text-anchor="middle">HACKER</text></g>
    </g>
    <g transform="translate(0 286)">
      <g clip-path="url(#portraitClip)"><image width="142" height="158" preserveAspectRatio="xMidYMid slice" xlink:href="img/Mercenario-jefe.png"/></g><rect width="142" height="158" rx="12" fill="none" stroke="#f4ee20" stroke-width="2"/><text x="71" y="185" class="label" fill="#f4ee20" text-anchor="middle">MERCENARIO</text>
      <g transform="translate(170)"><g clip-path="url(#portraitClip)"><image width="142" height="158" preserveAspectRatio="xMidYMid slice" xlink:href="img/Neones-jefe.png"/></g><rect width="142" height="158" rx="12" fill="none" stroke="#ff55da" stroke-width="2"/><text x="71" y="185" class="label" fill="#ff55da" text-anchor="middle">NEÓN</text></g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(96 850)">
    <rect width="1274" height="126" rx="18" fill="url(#magentaPanel)" stroke="#ff43d7" class="card"/>
    <text x="30" y="38" class="label" fill="#ff55da">MENSAJE FINAL PARA EL PÚBLICO</text>
    <text x="30" y="78" class="title" font-size="28" fill="#fff">“CYBERFILTER NO SOLO EVALÚA: CONVIERTE CADA DECISIÓN EN UNA OPORTUNIDAD PARA APRENDER.”</text>
    <text x="30" y="105" class="small">Cierra con una invitación: “Los invito a jugar una misión y descubrir la lógica detrás de cada agente.”</text>
  </g>
  <g transform="translate(1407 820)">
    <rect width="381" height="156" rx="18" fill="url(#cta)" filter="url(#softGlow)"/>
    <text x="190" y="46" class="label" fill="#fff" text-anchor="middle">CALL TO ACTION</text>
    <text x="190" y="90" class="title" font-size="29" fill="#fff" text-anchor="middle">JUGUEMOS</text>
    <text x="190" y="120" class="title" font-size="18" fill="#fff" text-anchor="middle">PARA APRENDER</text>
  </g>
</svg>
